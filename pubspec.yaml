name: heratmap
description: "Herat Industrial Town Map Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  get: ^4.6.6

  # Backend
  supabase_flutter: ^2.12.4

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^10.0.0

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Local cache for factories
  get_storage: ^2.1.1

  # UI
  loading_animation_widget: ^1.2.0+4
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/image/

  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Black.ttf
          weight: 900
        - asset: assets/fonts/Estedad-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
        - asset: assets/fonts/Estedad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Estedad-Medium.ttf
          weight: 500
        - asset: assets/fonts/Estedad-Regular.ttf
          weight: 400
        - asset: assets/fonts/Estedad-Light.ttf
          weight: 300
        - asset: assets/fonts/Estedad-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Estedad-Thin.ttf
          weight: 100
